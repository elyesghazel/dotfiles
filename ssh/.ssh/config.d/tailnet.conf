# Tailnet hosts, shared across machines via the `ssh` stow package.
# Only MagicDNS names here — this repo is public, so public IPs stay in the
# per-machine ~/.ssh/config, which pulls this file in with `Include config.d/*.conf`.

Host arch elyes-arch
    HostName elyes-arch
    User elyes

Host laptop elyes-laptop
    HostName elyes-laptop
    User elyes

Host pi pi-home
    HostName pi
    User elyes

# The server enforces Tailscale SSH "check" mode on its tailnet address, so the
# first login in a while prints a login.tailscale.com URL to approve in a browser.
Host server-ts elyes-ghazel-server
    HostName elyes-ghazel-server
    User elyes

Host *
    ServerAliveInterval 30
    ServerAliveCountMax 4
