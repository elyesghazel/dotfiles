server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    autoindex off;
    index index.html;

    # The share root itself reveals nothing — tokens are the only way in.
    location = / { return 404; }

    # Hide the bookkeeping files (.expires, .meta.json) from recipients.
    location ~ /\. { deny all; }

    # Forced-download alias: /<token>/dl/<path> serves /<token>/<path> as an
    # attachment. Kept separate from the plain path so the dashboard's <video>
    # can still stream and seek inline — Content-Disposition on the media itself
    # is what stops in-browser playback.
    location ~ "^/(?<tok>[A-Za-z0-9]+)/dl/(?<rest>.+)$" {
        alias /usr/share/nginx/html/$tok/$rest;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff";
        sendfile on;
        tcp_nopush on;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        sendfile on;
        tcp_nopush on;
    }
}
