server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    autoindex off;
    index index.html;
    server_tokens off;

    # Expired, unknown and mistyped links all land on one branded page.
    error_page 403 404 /_share/404.html;

    # The share root itself reveals nothing - tokens are the only way in.
    location = / { return 404; }

    # Shared elyesghazel design (tokens, components, theme.js, fonts, logo),
    # mounted from /opt/docker/design/public so pages load it same-origin.
    # Tokens are [A-Za-z0-9]+, so /_eg/ and /_share/ can never collide with one.
    location ^~ /_eg/ {
        alias /usr/share/nginx/eg/;
        expires 1d;
        add_header Cache-Control "public";
    }
    location ^~ /_share/ {
        alias /usr/share/nginx/share-static/;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Hide the bookkeeping files (.expires, .meta.json) from recipients.
    location ~ /\. { deny all; }

    # Forced-download alias: /<token>/dl/<path> serves /<token>/<path> as an
    # attachment. Kept separate from the plain path so the page's <video>
    # can still stream and seek inline - Content-Disposition on the media itself
    # is what stops in-browser playback.
    location ~ "^/(?<tok>[A-Za-z0-9]+)/dl/(?<rest>.+)$" {
        alias /usr/share/nginx/html/$tok/$rest;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Robots-Tag "noindex, nofollow" always;
        sendfile on;
        tcp_nopush on;
    }

    # Poster frames never change within a share.
    location ~ "^/[A-Za-z0-9]+/t/" {
        expires 7d;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        sendfile on;
        tcp_nopush on;
    }
}
