general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = pidof hyprlock || hyprlock
}

listener {
    timeout = 600
    # don't suspend while an SSH session is open (remote work after WoL)
    on-timeout = who | grep -q pts || systemctl suspend-then-hibernate
}
