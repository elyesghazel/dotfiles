#
# Zunder "graphite" look: one centered card, clock + password on the left,
# the SUPER+K agenda + reminders (waybar/scripts/gcal lock) on the right.
# Palette mirrors zunder's src/theme.rs and waybar's colors.dark.css.

$bg     = rgb(0e0e14)
$fg     = rgb(e6e6ee)
$muted  = rgb(9a9aac)
$faint  = rgb(5a5a6a)
$ghost  = rgb(34343f)
$accent = rgb(b4befe)
$hover  = rgb(1b1b27)
$font   = JetBrainsMono Nerd Font

$cardW  = 900
$cardH  = 480

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = ease, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 3, ease
    animation = fadeOut, 1, 3, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    path = $HOME/wallpapers/DT2.jpg
    color = $bg
    blur_passes = 4
    blur_size = 8
    brightness = 0.45
    vibrancy = 0.1
    noise = 0.012
}

# zunder's dim layer
shape {
    monitor =
    size = 100%, 100%
    color = rgba(0e0e1459)
    rounding = 0
    border_size = 0
    halign = center
    valign = center
}

# card
shape {
    monitor =
    size = $cardW, $cardH
    color = rgba(0e0e14f2)
    rounding = 10
    border_size = 1
    border_color = $ghost
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(00000099)
    halign = center
    valign = center
}

# column divider
shape {
    monitor =
    size = 1, 400
    color = $ghost
    rounding = 0
    border_size = 0
    halign = center
    valign = center
}

# ── left column ──────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $fg
    font_size = 84
    font_family = $font
    position = -225, 95
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $muted
    font_size = 15
    font_family = $font
    position = -225, 15
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] echo "<span foreground='##b4befe'>󰌾</span>  $USER@$(uname -n)"
    color = $faint
    font_size = 11
    font_family = $font
    position = -225, -75
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 46
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    outer_color = $ghost
    inner_color = $hover
    font_color = $fg
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="##5a5a6a">  password</span>
    hide_input = false
    rounding = 8
    check_color = $accent
    fail_color = rgb(f38ba8)
    fail_text = <span foreground="##f38ba8">$FAIL ($ATTEMPTS)</span>
    capslock_color = rgb(f9e2af)
    position = -225, -135
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:30000] b=/sys/class/power_supply/BAT0; c=$(cat $b/capacity); [ "$(cat $b/status)" = Charging ] && i=󰂄 || i=󰁹; echo "<span foreground='##b4befe'>$i</span>  $c%"
    color = $faint
    font_size = 11
    font_family = $font
    position = -225, -190
    halign = center
    valign = center
}

# ── right column ─────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:120000] ~/.config/waybar/scripts/gcal lock
    color = $fg
    font_size = 12
    font_family = $font
    text_align = left
    position = 225, 0
    halign = center
    valign = center
}
