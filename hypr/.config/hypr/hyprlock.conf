#        |___/|_|
#
# eg. look (design.elyesghazel.ch tokens): black, JetBrains Mono, one muted red accent.
# Left: clock + password. Right: agenda + reminders from today.elyesghazel.ch
# (scripts/lock-agenda, reads the today app's device key, falls back to `gcal lock`).

$bg     = rgb(000000)
$ink    = rgb(ffffff)
$body   = rgb(dcdcdc)
$dim    = rgb(a6a6a6)
$faint  = rgb(8a8a8a)
$rule   = rgb(333333)
$sunken = rgb(050505)
$accent = rgb(c47070)
$bad    = rgb(ff5f56)
$warn   = rgb(d9ad5b)
$font   = JetBrainsMono Nerd Font

$left   = -250
$right  = 250

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = ease, 0.2, 0.7, 0.2, 1
    animation = fadeIn, 1, 3, ease
    animation = fadeOut, 1, 3, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    path = $HOME/wallpapers/DT2.jpg
    color = $bg
    blur_passes = 4
    blur_size = 10
    brightness = 0.22
    vibrancy = 0
    noise = 0.01
}

# divider
shape {
    monitor =
    size = 1, 360
    color = $rule
    rounding = 0
    border_size = 0
    halign = center
    valign = center
}

# eg. mark, top left
label {
    monitor =
    text = <b>eg<span foreground="##c47070">.</span></b>
    color = $ink
    font_size = 18
    font_family = $font
    position = 48, -40
    halign = left
    valign = top
}

# battery, top right (prints nothing on machines without one)
label {
    monitor =
    text = cmd[update:30000] b=/sys/class/power_supply/BAT0; [ -d $b ] || exit 0; c=$(cat $b/capacity); s=$(cat $b/status); [ "$s" = Charging ] && t=" · charging" || t=""; [ "$c" -le 15 ] && [ -z "$t" ] && col="##ff5f56" || col="##8a8a8a"; echo "<span foreground='$col'>$c%$t</span>"
    color = $faint
    font_size = 11
    font_family = $font
    position = -48, -44
    halign = right
    valign = top
}

# ── left ─────────────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $ink
    font_size = 96
    font_family = $font
    position = $left, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "<span foreground='##a6a6a6'>$(date +'%A %d %B' | tr A-Z a-z)</span>  <span foreground='##8a8a8a'>· w$(date +%V)</span>"
    color = $dim
    font_size = 13
    font_family = $font
    position = $left, 12
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 44
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    dots_rounding = 0
    outer_color = $rule
    inner_color = $sunken
    font_color = $ink
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="##8a8a8a">password</span>
    hide_input = false
    rounding = 2
    check_color = $accent
    fail_color = $bad
    fail_text = <span foreground="##ff5f56">$FAIL</span>
    capslock_color = $warn
    position = $left, -70
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] echo "<span foreground='##8a8a8a'>//</span> $USER@$(uname -n)"
    color = $faint
    font_size = 10
    font_family = $font
    position = $left, -125
    halign = center
    valign = center
}

# ── right ────────────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:120000] ~/.config/hypr/scripts/lock-agenda
    color = $body
    font_size = 11
    font_family = $font
    text_align = left
    position = $right, 0
    halign = center
    valign = center
}
