# Font
font_family      JetBrainsMono Nerd Font
font_size        10

# Transparency
background_opacity 0.96
blur_program none

# Arcoiris
# Ported from the Ghostty built-in theme (upstream: mbadolato/iTerm2-Color-Schemes).
# Warm near-black base with a cream foreground.
foreground              #eee4d9
background              #201f1e
selection_foreground    #f3fffd
selection_background    #25524a

# Arcoiris' own cursor is a dark red (#872929) that reads poorly on this base,
# so the cursor is white with dark text — same override isaaclins uses.
cursor                  #ffffff
cursor_text_color       #201f1e

color0  #333333
color1  #da2700
color2  #12c258
color3  #ffc656
color4  #518bfc
color5  #e37bd9
color6  #63fad5
color7  #bab2b2
color8  #777777
color9  #ffb9b9
color10 #e3f6aa
color11 #ffddaa
color12 #b3e8f3
color13 #cbbaf9
color14 #bcffc7
color15 #efefef

# Cursor
cursor_shape beam
cursor_blink_interval 0

# Window
window_padding_width 8
remember_window_size no
initial_window_width  800
initial_window_height 500

# Misc
scrollback_lines 10000
enable_audio_bell no
confirm_os_window_close 0
